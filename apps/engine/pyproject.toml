[project]
name = "subtensor-labs-engine"
version = "0.1.0"
description = "Subtensor Labs Python data engine — metagraph sync, portfolio aggregation, predictions, screener"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]~=0.115.0",
    "uvicorn[standard]~=0.34.0",
    "pydantic[email]~=2.10.0",
    "pydantic-settings~=2.7.0",
    "sqlalchemy[asyncio]~=2.0.36",
    "asyncpg~=0.30.0",
    "alembic~=1.14.0",
    "redis[hiredis]~=5.2.0",
    "bittensor~=10.0.0",
    "scipy~=1.15.0",
    "numpy~=2.2.0",
    "pandas~=2.2.0",
    "argon2-cffi~=23.1.0",
    "cryptography~=44.0.0",
    "structlog~=24.4.0",
    "httpx~=0.28.0",
    "apscheduler~=3.10.0",
]

[dependency-groups]
dev = [
    "pytest~=8.3.0",
    "pytest-asyncio~=0.24.0",
    "pytest-cov~=6.0.0",
    "httpx~=0.28.0",
    "ruff~=0.9.0",
    "mypy~=1.14.0",
    "pre-commit~=4.0.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["bittensor.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
