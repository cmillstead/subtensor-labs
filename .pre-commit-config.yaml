repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^apps/engine/
      - id: ruff-format
        files: ^apps/engine/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.0
    hooks:
      - id: mypy
        files: ^apps/engine/engine/
        args: [--config-file=apps/engine/pyproject.toml]
        additional_dependencies:
          - pydantic
          - pydantic-settings
          - sqlalchemy[asyncio]
          - fastapi
          - redis
          - structlog
          - cryptography
          - httpx
          - apscheduler

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
